"""
Схема GraphQL для сервиса управления клиентскими данными (client-info).
Разработана на основе Swagger REST API v1.
Устраняет проблемы Over-fetching (избыточный трафик) и Under-fetching / Roundtrips (множественные REST-запросы).
"""

schema {
  query: Query
}

type Query {
  """
  Получить информацию о клиенте по ID.
  Позволяет гибко запрашивать как базовые данные клиента,
  так и связанные списки документов и родственников в рамках единого сетевого запроса.
  (Заменяет GET /clients/{id}, а также композитные сценарии)
  """
  client(id: ID!): Client

  """
  Получить список документов клиента по его ID.
  Прямой аналог REST-эндпоинта: GET /clients/{id}/documents
  """
  documents(clientId: ID!): [Document!]!

  """
  Получить список родственников клиента по его ID.
  Прямой аналог REST-эндпоинта: GET /clients/{id}/relatives
  """
  relatives(clientId: ID!): [Relative!]!
}

"""
Клиент сервиса страхования.
Карточка клиента может содержать сотни атрибутов, но клиент запрашивает только нужные.
"""
type Client {
  """Уникальный идентификатор клиента"""
  id: ID!

  """ФИО или имя клиента"""
  name: String!

  """Возраст клиента"""
  age: Int

  """Список документов клиента"""
  documents: [Document!]!

  """Список родственников клиента"""
  relatives: [Relative!]!
}

"""
Документ клиента (паспорт, водительское удостоверение, СТС и т.д.)
"""
type Document {
  """Идентификатор документа"""
  id: ID!

  """Тип документа (например: PASSPORT, DRIVER_LICENSE)"""
  type: String!

  """Номер и/или серия документа"""
  number: String!

  """Дата выдачи (ISO 8601, формат YYYY-MM-DD)"""
  issueDate: String!

  """Дата окончания срока действия (ISO 8601, format YYYY-MM-DD), опционально"""
  expiryDate: String
}

"""
Родственник клиента для программ страхования (ДМС, страхование жизни, путешествия)
"""
type Relative {
  """Идентификатор родственника"""
  id: ID!

  """Степень родства (например: SPOUSE, CHILD, PARENT)"""
  relationType: String!

  """ФИО или имя родственника"""
  name: String!

  """Возраст родственника"""
  age: Int
}
